[package]
name = "finery"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rmcp = { version = "0.12", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "signal"] }
tuicore = { version = "0.20.0", path = "../tuicore" }
