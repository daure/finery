[package]
name = "finery"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tuicore = { version = "0.18.0", path = "../tuicore" }
